<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CF FastTrack</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 340px;
            padding: 22px;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, #0f172a, #111827);
            color: white;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h2 {
            text-align: center;
            font-size: 24px;
            color: #60a5fa;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            margin-top: -7px;
        }

        input {
            width: 100%;
            padding: 14px 16px;

            border: 1px solid #334155;
            border-radius: 14px;

            background: #1e293b;
            color: white;

            font-size: 15px;
            outline: none;

            transition: 0.3s;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
        }

        input::placeholder {
            color: #64748b;
        }

        button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 14px;

            background: linear-gradient(135deg, #2563eb, #3b82f6);

            color: white;
            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        .hint {
            text-align: center;
            font-size: 11px;
            color: #64748b;
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
        }

        .result {
            padding: 10px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .result:hover {
            border-color: #3b82f6;
            background: #263449;
        }

        .result-name {
            font-size: 14px;
            font-weight: 600;
        }

        .result-code {
            margin-top: 4px;
            font-size: 11px;
            color: #94a3b8;
        }

        .message {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
        }

        .footer {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            margin-top: 3px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>⚡ CF FastTrack</h2>

        <div class="subtitle">
            Find and open Codeforces problems
        </div>

        <input
            type="text"
            id="problemInput"
            placeholder="1008A or problem name..."
            autocomplete="off"
        >

        <button id="openBtn">
            🚀 Find & Open
        </button>

        <div class="hint">
            Try: 1008A • 1008/A • 1008-A • Distinct Elements
        </div>

        <div id="results" class="results"></div>

        <div class="footer">
            Made for Competitive Programmers
        </div>

    </div>

    <script src="popup.js"></script>

</body>

</html>
